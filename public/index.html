<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Business — Plus qu'un service, une solution !</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid #334155;
      padding: 1rem 1.5rem;
      text-align: center;
    }
    .header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
    }
    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .chat-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .message {
      margin-bottom: 1rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user .bubble {
      background: #2563eb;
      margin-left: 2rem;
      border-radius: 12px 12px 2px 12px;
    }
    .message.agent .bubble {
      background: #334155;
      margin-right: 2rem;
      border-radius: 12px 12px 12px 2px;
    }
    .bubble {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .agent-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #38bdf8;
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .input-zone {
      display: flex;
      gap: 0.5rem;
    }
    .input-zone input {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
    }
    .input-zone input:focus {
      border-color: #38bdf8;
    }
    .input-zone button {
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .input-zone button:hover { background: #1d4ed8; }
    .input-zone button:disabled { background: #475569; cursor: not-allowed; }
    .status {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.75rem;
    }
    .status .online { color: #4ade80; }
  </style>
</head>
<body>
  <div class="header">
    <h1>DIGITAL BUSINESS</h1>
    <p>Plus qu'un service, une solution !</p>
  </div>

  <div class="container">
    <div class="chat-box" id="chatBox">
      <div class="message agent">
        <span class="agent-badge">DIRECTEUR</span>
        <div class="bubble">Bonjour ! Je suis l'assistant IA de Digital Business. Posez-moi votre question et je la transmettrai a l'agent competent.</div>
      </div>
    </div>

    <div class="input-zone">
      <input type="text" id="inputMsg" placeholder="Ecrivez votre message..." autocomplete="off">
      <button id="btnSend" onclick="envoyer()">Envoyer</button>
    </div>

    <div class="status">
      <span class="online" id="statusDot">●</span> <span id="statusText">Connecte</span>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const inputMsg = document.getElementById('inputMsg');
    const btnSend = document.getElementById('btnSend');
    const sessionId = 'sess_' + Date.now();

    inputMsg.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') envoyer();
    });

    function ajouterMessage(texte, type, agent) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      const badge = agent ? `<span class="agent-badge">${agent.toUpperCase()}</span>` : '';
      div.innerHTML = `${badge}<div class="bubble">${escapeHtml(texte)}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    async function envoyer() {
      const message = inputMsg.value.trim();
      if (!message) return;

      ajouterMessage(message, 'user');
      inputMsg.value = '';
      btnSend.disabled = true;

      try {
        const res = await fetch('/api/agent/question', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, session_id: sessionId })
        });
        const data = await res.json();

        if (data.erreur) {
          ajouterMessage(data.erreur, 'agent', 'erreur');
        } else {
          ajouterMessage(data.reponse, 'agent', data.agent);
        }
      } catch (err) {
        ajouterMessage('Erreur de connexion au serveur.', 'agent', 'systeme');
      }

      btnSend.disabled = false;
      inputMsg.focus();
    }
  </script>
</body>
</html>
